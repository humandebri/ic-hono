name: CI

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
      - name: Install wasm tools
        run: |
          cargo install ic-wasm
          cargo install wasm-tools
          cargo install wasi2ic
      - name: Install example dependencies
        run: |
          npm install --prefix examples/hono-basic
          npm install --prefix examples/hono-zod
          npm install --prefix examples/hono-fetch
          npm install --prefix examples/hono-openai
          npm install --prefix examples/hono-upstash
          npm install --prefix examples/hono-jose
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test
      - name: API contract
        run: scripts/check_api_contract.sh
      - name: Compatibility matrix
        run: scripts/check_compatibility_matrix.sh
      - name: Canister interface
        run: scripts/check_canister_interface.sh
      - name: Release audit
        run: scripts/check_release_audit.sh
      - name: Package smoke
        run: scripts/package_smoke.sh
      - name: Canister wasm build
        run: cargo build --target wasm32-wasip1 -p ic-edge-canister-template --release --features quickjs-ic
      - name: Runtime import check
        run: |
          scripts/build_canister_backend_wasm.sh /tmp/ic_edge_runtime_import_check.wasm
          if wasm-objdump -x /tmp/ic_edge_runtime_import_check.wasm | grep -q '<.*> <- \(env\|wasi_snapshot_preview1\)\.'; then
            echo "unexpected env.* or wasi_snapshot_preview1.* import after backend build" >&2
            exit 1
          fi
