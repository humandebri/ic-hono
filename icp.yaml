canisters:
  - name: edge
    build:
      steps:
        - type: script
          commands:
            - scripts/build_canister_backend_wasm.sh "$ICP_WASM_OUTPUT_PATH"
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata "candid:service" -f examples/canister-template/ic-edge-canister-template.did -v public --keep-name-section
