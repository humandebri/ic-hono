[package]
name = "ic-edge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
ic-edge-runtime = { path = "../crates/ic-edge-runtime" }
ic-edge-web = { path = "../crates/ic-edge-web" }
libfuzzer-sys = "0.4"
serde_json = "1.0"

[[bin]]
name = "hono_status_api"
path = "fuzz_targets/hono_status_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hono_suite_api"
path = "fuzz_targets/hono_suite_api.rs"
test = false
doc = false
bench = false
