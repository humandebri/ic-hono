[package]
name = "ic-edge-pack"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Packaging library and ic-edge CLI for Hono bundles targeting ICP canisters."
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
ic-edge-loader = { version = "0.2.0", path = "../ic-edge-loader" }
ic-edge-runtime = { version = "0.2.0", path = "../ic-edge-runtime" }
ic-edge-store = { version = "0.2.0", path = "../ic-edge-store" }
ic-edge-web = { version = "0.2.0", path = "../ic-edge-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "ic-edge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
