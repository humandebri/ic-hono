[package]
name = "ic-edge-runtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
quickjs-ic = ["dep:quickjs-wasm-rs"]

[dependencies]
ic-edge-web = { path = "../ic-edge-web" }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
rquickjs = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.quickjs-wasm-rs]
version = "3.1.0"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
path = "src/lib.rs"
